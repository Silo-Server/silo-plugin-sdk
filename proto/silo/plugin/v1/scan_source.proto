syntax = "proto3";

package silo.plugin.v1;

option go_package = "github.com/Silo-Server/silo-plugin-sdk/pkg/pluginproto/silo/plugin/v1;pluginv1";

// ScanSource lets the host pull changed filesystem paths from a provider
// (e.g. Sonarr/Radarr, inotify, Ceph). Pull only: the host owns the timer,
// marker storage, path rewrites, and scan enqueueing; the plugin never
// initiates.
service ScanSource {
  rpc PollChanges(PollChangesRequest) returns (PollChangesResponse);
}

message PollChangesRequest {
  // Which configured scan_source capability instance is being polled.
  string capability_id = 1;
  // Opaque continuation token from the previous PollChanges. Empty on first
  // run, which the provider treats as "start from now" (do not replay history).
  string marker = 2;
  // Resolved upstream connection for this source. The host resolves the
  // operator's connection config (own credentials, or a reused link) and passes
  // the concrete values here each poll, so the plugin stays credential-source
  // agnostic and never stores secrets at rest. Delivered over the local
  // host<->plugin gRPC channel only; plugins must avoid logging this request
  // without redacting secrets.
  ResolvedConnection connection = 3;
  // Host-owned source configuration for this autoscan source. The host stores
  // and edits this on the autoscan source row, then sends it on every poll so
  // scan-source plugins do not need to expose source-specific knobs through the
  // generic plugin settings page.
  map<string, string> source_config = 4;
}

// ResolvedConnection carries the concrete upstream credentials the plugin needs
// to reach its source (e.g. a Sonarr/Radarr base URL + API key).
message ResolvedConnection {
  string base_url = 1;
  string api_key = 2;
}

message PollChangesResponse {
  // Legacy: prefer changes. When changes has any entries the host ignores
  // this field. Absolute changed paths in the provider/source namespace. The
  // host applies autoscan source rewrite rules, then handles each path like a
  // SCAN_SOURCE_CHANGE_SCOPE_AUTO change: it scans the path's parent
  // directory. A directory without a trailing slash therefore scans its
  // parent, which is a whole library scan when the parent is a library root.
  repeated string source_paths = 1;
  // Opaque continuation token. The host stores it verbatim and echoes it back
  // on the next PollChanges; the host never parses it.
  string next_marker = 2;
  // Structured changes are preferred over source_paths; when present the host
  // ignores source_paths. Each change's scope tells the host whether its path
  // is a file or a directory. A deleted media file reported with
  // SCAN_SOURCE_CHANGE_SCOPE_FILE is marked missing; that scope lists the
  // exceptions. A scan of a directory that no longer exists leaves its catalog
  // rows in place, so for a deleted, moved or renamed directory also report its
  // parent directory.
  // docs/scan-source.md in the plugin SDK describes the full behavior.
  repeated ScanSourceChange changes = 3;
}

// ScanSourceChangeScope says how the host turns a rewritten path into a scan.
// Prefer FILE for files and SUBTREE for directories.
enum ScanSourceChangeScope {
  // Handled like SCAN_SOURCE_CHANGE_SCOPE_AUTO.
  SCAN_SOURCE_CHANGE_SCOPE_UNSPECIFIED = 0;
  // Scan the parent directory of the path. A directory without a trailing
  // slash scans its parent, which can be a whole library scan; with a
  // trailing slash it scans the directory itself.
  SCAN_SOURCE_CHANGE_SCOPE_AUTO = 1;
  // The path is a media file. The host scans it; a video file widens to its
  // directory except directly at a library root. An existing directory is
  // scanned as a subtree, a library root is dropped, and a media file that no
  // longer exists is marked missing while the library root is mounted. Other
  // files (an .nfo, a subtitle) and every file in a podcast library are
  // skipped.
  SCAN_SOURCE_CHANGE_SCOPE_FILE = 2;
  // The path is a directory below a library root. The host queues a scan of
  // it without checking that it exists; a library root itself is rejected.
  SCAN_SOURCE_CHANGE_SCOPE_SUBTREE = 3;
}

message ScanSourceChange {
  // Absolute changed path in the provider/source namespace. The host applies
  // the autoscan source rewrite rules before resolving this path.
  string source_path = 1;
  // Scope controls how the host resolves and enqueues the rewritten path.
  ScanSourceChangeScope scope = 2;
}
