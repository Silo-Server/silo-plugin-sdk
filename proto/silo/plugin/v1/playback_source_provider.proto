syntax = "proto3";

package silo.plugin.v1;

option go_package = "github.com/Silo-Server/silo-plugin-sdk/pkg/pluginproto/silo/plugin/v1;pluginv1";

service PlaybackSourceProvider {
  rpc DiscoverPlaybackSources(DiscoverPlaybackSourcesRequest) returns (DiscoverPlaybackSourcesResponse);
  rpc ResolvePlaybackSource(ResolvePlaybackSourceRequest) returns (ResolvePlaybackSourceResponse);
}

message PlaybackMediaIdentity {
  string content_type = 1;
  string title = 2;
  int32 year = 3;
  int32 season_number = 4;
  int32 episode_number = 5;
  map<string, string> provider_ids = 6;
}

message DiscoverPlaybackSourcesRequest {
  string capability_id = 1;
  PlaybackMediaIdentity media = 2;
}

message PlaybackSource {
  string source_id = 1;
  string display_name = 2;
  string protocol = 3;
  string container = 4;
  int64 size_bytes = 5;
  int32 bitrate_kbps = 6;
  int32 width = 7;
  int32 height = 8;
  string video_codec = 9;
  string audio_codec = 10;
  string dynamic_range = 11;
  bool cached = 12;
  int32 rank = 13;
}

message DiscoverPlaybackSourcesResponse {
  repeated PlaybackSource sources = 1;
}

message ResolvePlaybackSourceRequest {
  string capability_id = 1;
  string source_id = 2;
}

message ResolvePlaybackSourceResponse {
  string url = 1;
  int64 expires_at_unix = 2;
  map<string, string> headers = 3;
}
