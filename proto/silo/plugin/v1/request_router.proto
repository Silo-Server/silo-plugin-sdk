syntax = "proto3";

package silo.plugin.v1;

option go_package = "github.com/Silo-Server/silo-plugin-sdk/pkg/pluginproto/silo/plugin/v1;pluginv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// RequestRouter lets the host delegate whole-request fulfillment to a backend
// plugin (e.g. multi-instance Sonarr/Radarr, Seerr). The host owns the request
// lifecycle, quota/policy, the allowed-quality governance, and the target
// records; the plugin owns instance routing, submission, and status semantics.
// Connections are passed per call; the plugin stores no credentials.
service RequestRouter {
  rpc Fulfill(FulfillRequest) returns (FulfillResponse);
  rpc CheckStatus(CheckStatusRequest) returns (CheckStatusResponse);
  rpc ListConfigOptions(ListConfigOptionsRequest) returns (ListConfigOptionsResponse);
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}

message RequestDescriptor {
  string media_type = 1; // "movie" | "series"
  string title = 2;
  int32 year = 3;
  map<string, string> external_ids = 4;
  bool is_anime = 5;
  int64 requester_user_id = 6;
  string requester_profile_id = 7;
  // requester identity for plugins that attribute requests to a per-user account
  // on the downstream service (e.g. Seerr). Empty when the host cannot resolve it.
  string requester_email = 8;
  string requester_username = 9;
  // seasons lists the requested season numbers of a series; 0 is Specials.
  // Empty means the whole series, which is what every request meant before
  // this field existed. Only set when media_type is "series". Plugins that
  // declare RequestRouterDescriptor.supports_seasons must fulfil only these
  // seasons; see that field for the full contract.
  repeated int32 seasons = 10;
}

// RequestRouterDescriptor is typed request_router.v1 contract metadata that the
// host reads from the manifest without launching the plugin. An absent
// descriptor means every flag is false, which is how the host treats plugins
// built before a flag existed.
message RequestRouterDescriptor {
  // supports_seasons declares that Fulfill and CheckStatus honour
  // RequestDescriptor.seasons. A declaring plugin acquires only the listed
  // seasons; when the series already exists upstream it adds those seasons to
  // what is already tracked and leaves other seasons unchanged. Repeating a
  // request converges rather than duplicating work. The host sends a request
  // for only the missing seasons of a series it already has only to plugins
  // that set this flag, because other plugins would add the whole series.
  bool supports_seasons = 1;
  // reports_download_progress declares that CheckStatus fills
  // TargetStatus.progress for targets with downloads in flight. The host
  // notices progress on its regular reconcile pass, then asks a declaring
  // plugin every minute about a target that is downloading and has reported
  // progress. A target whose progress comes back unset drops back to the
  // regular cadence. Hosts ignore progress from plugins that do not declare
  // this.
  bool reports_download_progress = 2;
  // wording is how clients describe a request while this plugin fulfils it.
  // Unset, or any field left empty, means the host's own neutral words.
  RequestRouterWording wording = 3;
}

// RequestRouterWording names the part of a request that a request router
// handles, in words that fit how the plugin works. Clients draw a request as
// four steps: requested, approved, the router's step, and in the library. The
// router names only its own step and the two statuses it reports while the
// request is on it; the host words the other steps. Clients show these words
// to everyone who can see the request, so keep them plain English and leave
// out release names, indexers, download clients and paths. Every value is a
// single line without leading or trailing spaces.
message RequestRouterWording {
  // step names the router's step on the request's track, e.g. "Processing".
  // At most 24 characters.
  string step = 1;
  // queued describes a request whose live targets are all queued: accepted
  // by the downstream service, with nothing moving yet.
  RequestStatusWording queued = 2;
  // downloading describes a request with at least one downloading target.
  RequestStatusWording downloading = 3;
}

// RequestStatusWording describes one status of a request on the router's step.
message RequestStatusWording {
  // label is one to three words for cards, list rows and the current step,
  // e.g. "Searching". At most 24 characters.
  string label = 1;
  // detail is one sentence shown under the current step on the request's
  // page, e.g. "Seerr takes it from here." At most 140 characters.
  string detail = 2;
}

message RouterConnection {
  string id = 1;
  string base_url = 2;
  string api_key = 3;
  // plugin-declared config blob (e.g. service_kind, root_folder,
  // quality_profile_id)
  google.protobuf.Struct config = 4;
}

// RequestedQuality is one quality tier the host wants fulfilled. The host owns
// quality governance, so it stamps is4k rather than each plugin re-deriving it
// from the id string. id is the tier identity echoed back as
// FulfillmentTarget.quality (e.g. "1080p" / "2160p").
message RequestedQuality {
  string id = 1;
  bool is4k = 2;
}

message FulfillRequest {
  string capability_id = 1;
  RequestDescriptor request = 2;
  repeated RequestedQuality qualities = 3;
  repeated RouterConnection connections = 4;
}

message FulfillmentTarget {
  string quality = 1;
  string connection_id = 2;
  string external_id = 3; // upstream id, e.g. arr movie/series id
  // raw upstream status passed through for display; status is the
  // host-normalized value
  string external_status = 4;
  // host-normalized: "queued" | "downloading" | "completed" | "failed"
  string status = 5;
  string message = 6;
  // wording describes this target to requesters, in place of the manifest's
  // wording for its status; see TargetStatus.wording.
  RequestStatusWording wording = 7;
}

message FulfillResponse {
  repeated FulfillmentTarget targets = 1;
  // set when zero targets, e.g. "no radarr instance configured"
  string message = 2;
}

message TargetRef {
  string quality = 1;
  string connection_id = 2;
  string external_id = 3;
}

message CheckStatusRequest {
  string capability_id = 1;
  RequestDescriptor request = 2;
  repeated TargetRef targets = 3;
  repeated RouterConnection connections = 4;
}

// DownloadProgress is how far a target's downloads are, as the downstream
// service reports them. Set only while the target is queued or downloading and
// the service has something in its download queue for it.
message DownloadProgress {
  // host-normalized: "queued" | "downloading" | "paused" | "stalled" |
  // "importing" | "import_blocked". Required whenever progress is set: hosts
  // count a progress with an empty phase and a bytes_total of 0 as unset. A
  // target with several downloads reports the phase that ranks first in
  // import_blocked > stalled > downloading > importing > paused > queued.
  // Hosts treat unknown values as downloading.
  string phase = 1;
  // Summed over the target's distinct downloads (a season pack counts once).
  // 0 whenever any of those downloads has an unknown size, so the host shows
  // no percentage rather than an overstated one.
  int64 bytes_total = 2;
  // What remains of bytes_total, from 0 to bytes_total; 0 whenever
  // bytes_total is 0.
  int64 bytes_left = 3;
  // Latest estimated completion across the downloads; unset when unknown.
  google.protobuf.Timestamp estimated_completion = 4;
  // Distinct downloads in flight for the target.
  int32 downloads = 5;
}

message TargetStatus {
  string quality = 1;
  string connection_id = 2;
  // host-normalized: "queued" | "downloading" | "completed" | "failed"
  string status = 3;
  string external_status = 4; // raw upstream status passed through for display
  string message = 5;
  // progress is filled by plugins that declare
  // RequestRouterDescriptor.reports_download_progress; hosts ignore it from
  // other plugins. The host first sees it on its regular reconcile pass, then
  // checks the target every minute while progress is set and the target is
  // downloading. Leaving it unset, or setting it with an empty phase and a
  // bytes_total of 0, means nothing is in flight: the host clears the progress
  // it last stored and checks the target on its regular reconcile cadence
  // again.
  DownloadProgress progress = 6;
  // wording describes where this target is, for everyone who can see the
  // request, when the plugin knows more than its status says: e.g. label
  // "Not out yet", detail "Radarr adds it once it's out, expected
  // December 18, 2026." It replaces the manifest's wording for the target's
  // status (RequestRouterWording.queued or .downloading): a label replaces
  // both the label and the detail, and a detail alone replaces only the
  // detail. Set it only while the status is queued or downloading. Each
  // answer replaces the last, so leave it unset once it no longer applies.
  // The same limits apply as to the manifest's wording, and hosts drop
  // wording that breaks them. Never include release names, indexers,
  // download clients or paths.
  RequestStatusWording wording = 7;
}

message CheckStatusResponse {
  repeated TargetStatus statuses = 1;
}

message ConfigOption {
  string value = 1;
  string label = 2;
}

message ConfigOptionList {
  repeated ConfigOption options = 1;
}

message ListConfigOptionsRequest {
  string capability_id = 1;
  RouterConnection connection = 2;
}

message ListConfigOptionsResponse {
  // keyed by config field, e.g. "root_folder"
  map<string, ConfigOptionList> options_by_field = 1;
}

message TestConnectionRequest {
  string capability_id = 1;
  RouterConnection connection = 2;
}

message TestConnectionResponse {
  bool ok = 1;
  string message = 2;
}

message ValidateRequest {
  string capability_id = 1;
  RouterConnection connection = 2;
  // siblings are the other connections bound to this installation+capability, so
  // a plugin can enforce cross-connection rules (e.g. one default per service
  // type). They carry id + config only — no base_url/api_key (validation reads
  // flags, not credentials).
  repeated RouterConnection siblings = 3;
}

message ValidateResponse {
  map<string, string> field_errors = 1; // keyed by config field; empty = no field errors
  string form_error = 2;                 // form-level error; empty = none
}
