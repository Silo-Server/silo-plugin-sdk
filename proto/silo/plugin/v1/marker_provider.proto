syntax = "proto3";

package silo.plugin.v1;

option go_package = "github.com/Silo-Server/silo-plugin-sdk/pkg/pluginproto/silo/plugin/v1;pluginv1";

import "google/protobuf/struct.proto";

service MarkerProvider {
  rpc FetchMarkers(FetchMarkersRequest) returns (FetchMarkersResponse);
  rpc SubmitMarker(SubmitMarkerRequest) returns (SubmitMarkerResponse);
  rpc GetMarkerProviderStats(GetMarkerProviderStatsRequest) returns (MarkerProviderStatsResponse);
}

message MarkerExternalIDs {
  string tmdb_id = 1;
  string imdb_id = 2;
  string tvdb_id = 3;
  google.protobuf.Struct provider_ids = 4;
}

// For an episode, external_ids names the series, and season_number and
// episode_number place the episode in it using the host catalog's numbering
// (season 0 holds specials). episode_external_ids names the provider episode
// records the host matched at those numbers. The host matches each
// provider's episodes by number alone, so IDs from two providers can name
// different episodes where the providers number a series differently.
// episode_numbering resolves that: it is the external ID key ("tvdb" or
// "tmdb") of the provider whose numbering the episode follows, the first in
// the library's episode chain that supplied it. episode_title is in the
// library's metadata language. The episode fields are empty for a movie and
// when the host has no value.
message FetchMarkersRequest {
  string item_type = 1; // "movie" | "episode"
  MarkerExternalIDs external_ids = 2;
  int32 season_number = 3;
  int32 episode_number = 4;
  double duration_seconds = 5;
  google.protobuf.Struct metadata = 6;
  MarkerExternalIDs episode_external_ids = 7;
  string episode_title = 8;
  string episode_numbering = 9;
  // OpenSubtitles hash of the file (16 lowercase hex), or empty when the host
  // has none. It covers the file size and the first and last 64 KiB, so a
  // remux or re-encode gets a new hash, but two different files can share
  // one. A provider must not send it off the machine unhashed.
  string file_hash = 10;
  // File size in bytes, or 0 when unknown.
  int64 file_size = 11;
  // The host understands MarkerSegment.absent. A provider must not return
  // absent segments when this is false: older hosts read a segment without
  // bounds as covering the whole file.
  bool accepts_absent = 12;
}

message MarkerSegment {
  string segment = 1; // "intro" | "credits" | "recap" | "preview"
  optional double start_seconds = 2;
  optional double end_seconds = 3;
  double confidence = 4;
  int32 submission_count = 5;
  string algorithm = 6;
  google.protobuf.Struct metadata = 7;
  // The provider asserts the item has no segment of this kind. start_seconds
  // and end_seconds are unset; confidence applies to the absence.
  bool absent = 8;
}

message FetchMarkersResponse {
  repeated MarkerSegment markers = 1;
  google.protobuf.Struct metadata = 2;
}

// The item fields follow FetchMarkersRequest.
message SubmitMarkerRequest {
  string item_type = 1; // "movie" | "episode"
  MarkerExternalIDs external_ids = 2;
  int32 season_number = 3;
  int32 episode_number = 4;
  string segment = 5; // "intro" | "credits" | "recap" | "preview"
  optional double start_seconds = 6;
  optional double end_seconds = 7;
  double duration_seconds = 8;
  google.protobuf.Struct metadata = 9;
  MarkerExternalIDs episode_external_ids = 10;
  string episode_title = 11;
  string episode_numbering = 12;
  string file_hash = 13; // as FetchMarkersRequest.file_hash
  int64 file_size = 14;
  // Where the host's marker came from: "scanner" (local detection, including
  // chapters) or "manual" (edited by a person). Empty from hosts older than
  // this field.
  string source = 15;
  // The host's algorithm ID for the marker, e.g. "chromaprint:dialogue:v4",
  // or "manual:v1".
  string algorithm = 16;
  // The host's confidence in the marker, 0-1.
  double confidence = 17;
  // The submission says the item has no segment of this kind. start_seconds
  // and end_seconds are unset.
  bool absent = 18;
}

message SubmitMarkerResponse {
  string submission_id = 1;
  string status = 2; // "pending" | "accepted" | "rejected"
  double weight = 3;
  google.protobuf.Struct metadata = 4;
}

message GetMarkerProviderStatsRequest {}

message MarkerProviderStatsResponse {
  int32 total = 1;
  int32 accepted = 2;
  int32 pending = 3;
  int32 rejected = 4;
  double acceptance_rate = 5;
  int32 current_streak = 6;
  int32 best_streak = 7;
  google.protobuf.Struct metadata = 8;
}
