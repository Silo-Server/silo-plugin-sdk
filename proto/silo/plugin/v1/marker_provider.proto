syntax = "proto3";

package silo.plugin.v1;

option go_package = "github.com/Silo-Server/silo-plugin-sdk/pkg/pluginproto/silo/plugin/v1;pluginv1";

import "google/protobuf/struct.proto";

service MarkerProvider {
  rpc FetchMarkers(FetchMarkersRequest) returns (FetchMarkersResponse);
  rpc SubmitMarker(SubmitMarkerRequest) returns (SubmitMarkerResponse);
  rpc GetMarkerProviderStats(GetMarkerProviderStatsRequest) returns (MarkerProviderStatsResponse);
}

// MarkerReporting is separate from MarkerProvider so adding reporting does not
// add methods to the released MarkerProviderServer Go interface. Added in
// v0.33.0. Register it with runtime.WithMarkerReporting; the SDK runtime also
// registers it when the MarkerProvider server itself implements
// MarkerReportingServer.
//
// A plugin that does not serve it answers Unimplemented, and hosts treat that
// as "this provider cannot report": a client offers no report control for a
// segment the provider did not mark reportable, and a report that arrives
// anyway fails as unsupported rather than as an error. An outcome a host does
// not recognize is a different case: the provider answered, so hosts read that
// as a refusal, which is the one reading that never claims a report was
// recorded.
service MarkerReporting {
  // ReportMarker tells the provider that the segment the host is showing for
  // this item is wrong. It is a viewer's complaint about one segment, not a
  // submission: it carries no bounds, and the provider decides what its service
  // does with it.
  //
  // The host resolves the item and its numbering itself and calls the provider
  // that supplied the segment, so a provider can trust the identity it is
  // given. Refusals the plugin classes as faults use gRPC status codes like
  // SubmitMarker: InvalidArgument for a request the provider will never accept,
  // FailedPrecondition for provider state such as a credential an operator has
  // not configured, and ResourceExhausted with RetryInfo when the provider
  // wants the caller to try later.
  rpc ReportMarker(ReportMarkerRequest) returns (ReportMarkerResponse);
}

message MarkerExternalIDs {
  string tmdb_id = 1;
  string imdb_id = 2;
  string tvdb_id = 3;
  google.protobuf.Struct provider_ids = 4;
}

// For an episode, external_ids names the series, and season_number and
// episode_number place the episode in it using the host catalog's numbering
// (season 0 holds specials). episode_external_ids names the provider episode
// records the host matched at those numbers. The host matches each
// provider's episodes by number alone, so IDs from two providers can name
// different episodes where the providers number a series differently.
// episode_numbering resolves that: it is the external ID key ("tvdb" or
// "tmdb") of the provider whose numbering the episode follows, the first in
// the library's episode chain that supplied it. episode_title is in the
// library's metadata language. The episode fields are empty for a movie and
// when the host has no value.
message FetchMarkersRequest {
  string item_type = 1; // "movie" | "episode"
  MarkerExternalIDs external_ids = 2;
  int32 season_number = 3;
  int32 episode_number = 4;
  double duration_seconds = 5;
  google.protobuf.Struct metadata = 6;
  MarkerExternalIDs episode_external_ids = 7;
  string episode_title = 8;
  string episode_numbering = 9;
  // OpenSubtitles hash of the file (16 lowercase hex), or empty when the host
  // has none. It covers the file size and the first and last 64 KiB, so a
  // remux or re-encode gets a new hash, but two different files can share
  // one. A provider must not send it off the machine unhashed.
  string file_hash = 10;
  // File size in bytes, or 0 when unknown.
  int64 file_size = 11;
  // The host understands MarkerSegment.absent. A provider must not return
  // absent segments when this is false: older hosts read a segment without
  // bounds as covering the whole file.
  bool accepts_absent = 12;
}

message MarkerSegment {
  string segment = 1; // "intro" | "credits" | "recap" | "preview"
  optional double start_seconds = 2;
  optional double end_seconds = 3;
  double confidence = 4;
  int32 submission_count = 5;
  string algorithm = 6;
  google.protobuf.Struct metadata = 7;
  // The provider asserts the item has no segment of this kind. start_seconds
  // and end_seconds are unset; confidence applies to the absence.
  bool absent = 8;
  // The provider would accept a report for this segment now, so a host may
  // offer a client a control that says the segment is wrong. A provider sets it
  // per segment and only when it really would: a provider that reports through
  // a service credential sets it only while that credential is configured.
  //
  // Plain bool, so a host that predates the field reads false and a plugin that
  // predates it sends false. Absence and zero mean the same thing here: not
  // reportable, which is also what a host must assume for a provider that does
  // not serve MarkerReporting.
  bool reportable = 9;
}

message FetchMarkersResponse {
  repeated MarkerSegment markers = 1;
  google.protobuf.Struct metadata = 2;
}

// The item fields follow FetchMarkersRequest.
message SubmitMarkerRequest {
  string item_type = 1; // "movie" | "episode"
  MarkerExternalIDs external_ids = 2;
  int32 season_number = 3;
  int32 episode_number = 4;
  string segment = 5; // "intro" | "credits" | "recap" | "preview"
  optional double start_seconds = 6;
  optional double end_seconds = 7;
  double duration_seconds = 8;
  google.protobuf.Struct metadata = 9;
  MarkerExternalIDs episode_external_ids = 10;
  string episode_title = 11;
  string episode_numbering = 12;
  string file_hash = 13; // as FetchMarkersRequest.file_hash
  int64 file_size = 14;
  // Where the host's marker came from: "scanner" (local detection, including
  // chapters) or "manual" (edited by a person). Empty from hosts older than
  // this field.
  string source = 15;
  // The host's algorithm ID for the marker, e.g. "chromaprint:dialogue:v4",
  // or "manual:v1".
  string algorithm = 16;
  // The host's confidence in the marker, 0-1.
  double confidence = 17;
  // The submission says the item has no segment of this kind. start_seconds
  // and end_seconds are unset.
  bool absent = 18;
}

message SubmitMarkerResponse {
  string submission_id = 1;
  string status = 2; // "pending" | "accepted" | "rejected"
  double weight = 3;
  google.protobuf.Struct metadata = 4;
}

message GetMarkerProviderStatsRequest {}

message MarkerProviderStatsResponse {
  int32 total = 1;
  int32 accepted = 2;
  int32 pending = 3;
  int32 rejected = 4;
  double acceptance_rate = 5;
  int32 current_streak = 6;
  int32 best_streak = 7;
  google.protobuf.Struct metadata = 8;
}

// The item fields follow FetchMarkersRequest, because a report is about the
// markers the host fetched for the same item. external_ids names the title,
// season_number and episode_number place the episode in it in the host
// catalog's numbering, and episode_numbering is the external ID key of the
// provider whose numbering the host used. A provider that reads season and
// episode in its own numbering must translate them by that key, the same way it
// does for a fetch: the numbers alone can name a different episode.
message ReportMarkerRequest {
  string item_type = 1; // "movie" | "episode"
  MarkerExternalIDs external_ids = 2;
  // Season in the host catalog's numbering, and presence is significant: unset
  // means the host could not place the episode in a season, while an explicit
  // zero is Specials. A movie leaves it unset. A provider that cannot tell the
  // two apart may report the wrong episode, so refuse rather than guess.
  optional int32 season_number = 3;
  int32 episode_number = 4;
  string segment = 5; // "intro" | "credits" | "recap" | "preview"
  double duration_seconds = 6;
  MarkerExternalIDs episode_external_ids = 7;
  string episode_title = 8;
  string episode_numbering = 9;
  // The file the viewer was watching, as in FetchMarkersRequest. A report is
  // about one copy of the media, so a provider that keys reports by file can
  // use them; a provider that keys them by media ignores them.
  string file_hash = 10;
  int64 file_size = 11;
  google.protobuf.Struct metadata = 12;
}

message ReportMarkerResponse {
  MarkerReportOutcome outcome = 1;
  // Open vocabulary explaining a REFUSED outcome, for example
  // "segment_not_reportable" or "unsupported_media". A host that does not
  // recognize a value reads it as a plain refusal and shows the viewer that the
  // provider would not take the report.
  string reason = 2;
  // What to tell the viewer or the administrator about a refusal, in the
  // provider's own words. Never carries a credential.
  string detail = 3;
  google.protobuf.Struct metadata = 4;
}

enum MarkerReportOutcome {
  MARKER_REPORT_OUTCOME_UNSPECIFIED = 0;
  MARKER_REPORT_OUTCOME_REPORTED = 1;
  // The provider already holds this report, for example because the service
  // keys one report per account per item. Settled, not a failure.
  MARKER_REPORT_OUTCOME_ALREADY_REPORTED = 2;
  // The provider declined and the report was not recorded. reason and detail
  // say why; the caller may report again later only if reason says so.
  MARKER_REPORT_OUTCOME_REFUSED = 3;
}
