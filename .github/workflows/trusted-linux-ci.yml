name: Trusted Linux CI

# Runner-group policy allows this file only at refs/heads/main.
# The host controller checks live membership and creates a runner for this run.
on:
  workflow_call:
    inputs:
      self_hosted:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.self_hosted && (github.repository == 'Silo-Server/silo-plugin-sdk' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))) && fromJSON(format('["self-hosted","linux","x64","silo-linux","silo-run-{0}-{1}","silo-job-test"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run tests
        run: go test ./...

      - name: Build example plugin
        run: go build ./examples/hello-scheduled-task

      - name: Build hello-runtime-host example
        run: go build ./examples/hello-runtime-host
